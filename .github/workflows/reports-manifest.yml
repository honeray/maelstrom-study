name: Rebuild reports manifest

# Runs whenever anything changes in reports/, regenerates reports/manifest.json
# and commits it back. The homepage reads that manifest, so publishing a report
# is simply: drop the file in reports/ and push.

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
      - ".github/scripts/build-manifest.mjs"
  workflow_dispatch:

concurrency:
  group: reports-manifest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for accurate file dates from git log

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate manifest
        run: node .github/scripts/build-manifest.mjs

      - name: Commit if it changed
        run: |
          if git diff --quiet -- reports/manifest.json; then
            echo "manifest unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/manifest.json
          git commit -m "chore(reports): refresh manifest [skip ci]"
          git push
