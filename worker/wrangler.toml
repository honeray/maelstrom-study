#:schema node_modules/wrangler/config-schema.json
name = "maelstrom-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Every two minutes the worker commits anything that changed to the private
# data repository. Final submissions are committed immediately instead.
[triggers]
crons = ["*/2 * * * *"]

[vars]
DATA_REPO = "honeray/maelstrom-study-data"
GIT_BRANCH = "main"
SURVEYS = "delphi-round-1,delphi-round-2"
ALLOWED_ORIGINS = "https://honeray.github.io,http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500"
RATE_LIMIT_PER_MINUTE = "90"
GIT_COMMITTER_NAME = "MAELStrOM Collector"
GIT_COMMITTER_EMAIL = "collector@users.noreply.github.com"

[[kv_namespaces]]
binding = "MAELSTROM_KV"
id = "1d6fa11b59ba426a96b27c576c676984"

# Secrets are set with `wrangler secret put`, never committed:
#   GITHUB_TOKEN  fine-grained PAT with Contents: read & write on DATA_REPO
#   ADMIN_TOKEN   long random string, only used by /v1/flush
